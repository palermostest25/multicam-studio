# Multicam Studio for Docker / Arcane.
# Open http://<server>:8765 once the container is running.
services:
  multicam-studio:
    image: ghcr.io/palermostest25/multicam-studio:latest
    build: .
    container_name: multicam-studio
    init: true                # reaps FFmpeg processes when a render is cancelled
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"   # owner of the exported files
    ports:
      - "${MULTICAM_PORT:-8765}:8765"
    environment:
      # Strongly recommended when the port is reachable from other machines.
      MULTICAM_PASSWORD: ${MULTICAM_PASSWORD:-}
      # Optional, comma-separated, e.g. "studio.lan,192.168.1.20".
      MULTICAM_ALLOWED_HOSTS: ${MULTICAM_ALLOWED_HOSTS:-}
    volumes:
      # Create these host folders first so they belong to PUID/PGID.
      - ${RECORDINGS_DIR:-./recordings}:/media/recordings
      - ${EXPORTS_DIR:-./exports}:/media/exports
      - multicam-state:/state

volumes:
  multicam-state:
