<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sign in · Multicam Studio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--bg:#0e100f;--panel:#171a17;--border:#2c322b;--text:#edf1e9;--muted:#929c91;--accent:#dbe7ba;--a:#e6b774;--b:#8dcccf;--red:#f0a89c;
    --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);display:grid;place-items:center;padding:24px 16px;overflow:hidden}
  /* Two soft lights in the camera colours, like stage lighting behind the card. */
  body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.16;pointer-events:none;z-index:0}
  body::before{background:var(--a);top:-34vmax;left:-22vmax}
  body::after{background:var(--b);bottom:-36vmax;right:-24vmax}
  main{position:relative;z-index:1;width:100%;max-width:380px}
  .card{background:linear-gradient(180deg,#1b1f1b,#161916);border:1px solid var(--border);border-radius:18px;padding:34px 30px 28px;
    box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;font-size:18px;letter-spacing:-.4px}
  .brand strong{font-weight:350;color:#b7c0b5}
  .icon{position:relative;width:34px;height:32px;flex:none}
  .icon i{position:absolute;border:2px solid var(--a);border-radius:4px;width:26px;height:18px;left:0;top:2px}
  .icon i+i{width:15px;height:25px;left:17px;top:7px;border-color:var(--b);background:#181b18}
  h1{margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:-.5px}
  p.lead{margin:0 0 24px;color:var(--muted);font-size:14px}
  label{display:block;font-size:12px;font-weight:500;color:#b7c0b5;margin-bottom:7px}
  .field{position:relative}
  input{width:100%;font:inherit;color:var(--text);background:#0f120f;border:1px solid var(--border);border-radius:10px;padding:13px 76px 13px 14px;
    transition:border-color .15s,box-shadow .15s}
  input:focus{outline:none;border-color:#6b7a58;box-shadow:0 0 0 3px rgba(219,231,186,.12)}
  input[aria-invalid=true]{border-color:#8a4f45}
  .reveal{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:inherit;font-size:12px;color:var(--muted);background:none;border:0;
    border-radius:7px;padding:7px 10px;cursor:pointer}
  .reveal:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .submit{margin-top:16px;width:100%;font:inherit;font-weight:600;color:#141812;background:var(--accent);border:0;border-radius:10px;padding:13px;
    cursor:pointer;transition:filter .15s,transform .05s}
  .submit:hover{filter:brightness(1.06)}
  .submit:active{transform:translateY(1px)}
  .submit:disabled{opacity:.6;cursor:progress}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .error{min-height:20px;margin:12px 0 0;font-size:13px;color:var(--red)}
  .note{display:flex;gap:9px;align-items:flex-start;margin:22px 2px 0;color:#727c70;font-size:12px;line-height:1.6}
  .note span{color:var(--b);font-size:14px;line-height:1.3}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .shake{animation:shake .32s ease}
  @media(prefers-reduced-motion:reduce){.shake{animation:none}.submit{transition:none}}
  @media(max-width:420px){.card{padding:28px 20px 22px;border-radius:16px}h1{font-size:22px}}
</style>
</head>
<body>
<main>
  <form class="card" id="form" novalidate>
    <div class="brand"><span class="icon" aria-hidden="true"><i></i><i></i></span><span>Multicam <strong>Studio</strong></span></div>
    <h1>Welcome back</h1>
    <p class="lead">Enter the studio password to continue.</p>
    <label for="password">Password</label>
    <div class="field">
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
      <button class="reveal" type="button" id="reveal" aria-controls="password" aria-pressed="false">Show</button>
    </div>
    <button class="submit" type="submit" id="submit">Sign in</button>
    <p class="error" id="error" role="alert"></p>
  </form>
  <p class="note"><span aria-hidden="true">●</span>Renders run on the server, so they keep going when you close this page or turn your computer off.</p>
</main>
<script>
  const form = document.getElementById('form'), input = document.getElementById('password');
  const error = document.getElementById('error'), submit = document.getElementById('submit'), reveal = document.getElementById('reveal');
  reveal.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    reveal.textContent = show ? 'Hide' : 'Show';
    reveal.setAttribute('aria-pressed', String(show));
    input.focus();
  });
  input.addEventListener('input', () => { error.textContent = ''; input.removeAttribute('aria-invalid'); });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!input.value) { input.focus(); return; }
    submit.disabled = true; submit.textContent = 'Signing in…'; error.textContent = '';
    try {
      const response = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                                   body: JSON.stringify({password: input.value})});
      if (response.ok) { location.replace('/'); return; }
      const body = await response.json().catch(() => ({}));
      error.textContent = body.error || 'Sign-in failed. Try again.';
      input.setAttribute('aria-invalid', 'true'); input.select();
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    } catch {
      error.textContent = 'Can’t reach the studio. Check it is running.';
    }
    submit.disabled = false; submit.textContent = 'Sign in';
  });
</script>
</body>
</html>
